---
layout: default
title: Blog
title_description: This blog will serve as a place to put any interesting things I've discovered or learned while working on projects or studying.
---

<ol class="post-list">
	{% for post in site.posts %}
	<li>
		<h2><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>
		<time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%B %d, %Y' }}</time>
	</li>
	{% endfor %}
</ol>
